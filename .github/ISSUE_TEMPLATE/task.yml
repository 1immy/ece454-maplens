name: Task
description: A unit of work from the project schedule
labels: ["task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A · Map understanding
        - B · Localization
        - C · Navigation and app
        - Shared
    validations:
      required: true
  - type: input
    id: gantt
    attributes:
      label: Gantt task ID
      placeholder: "e.g. 5 (Corridor skeletonization)"
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Concrete, checkable outcome
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
